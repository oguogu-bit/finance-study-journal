name: Daily finance study

on:
  schedule:
    # 06:00 JST
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional target date in YYYY-MM-DD"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-finance-study
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate study note
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python scripts/generate_daily_study.py --date "${{ inputs.date }}" --repo .
          else
            python scripts/generate_daily_study.py --repo .
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md 20*/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          title="$(git diff --cached --name-only | tr '\n' ' ')"
          git commit -m "📚 Daily finance study"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
